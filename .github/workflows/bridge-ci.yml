name: GP compiler and Bridge CI

on:
  push:
    branches:
      - feature/gp-bridge-v0.2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GP_C_COMPILER: gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Run complete GP validation with native tests enabled
        run: make validate
