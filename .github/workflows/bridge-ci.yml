name: GP compiler and Bridge CI

on:
  push:
    branches:
      - feature/gp-bridge-v0.2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Recreate ignored golden bytecode fixtures
        run: |
          for source in tests/fixtures/bytecode_v2/*.gp; do
            test -f "$source"
            python3 gp_compile.py "$source" --output "\${source%.gp}.gbc"
          done
          sha256sum -c tests/fixtures/bytecode_v2/SHA256SUMS
      - name: Run complete GP validation
        run: make validate
